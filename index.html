<script>
    var datosCapacitacion = {};
    var currentUrl = "";
    var logoBase64 = "";

    document.getElementById('setup-fecha').valueAsDate = new Date();

    function procesarLogo(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;
        var file = files.item(0);

        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var canvasTemp = document.createElement('canvas');
                var maxWidth = 100;
                var scale = maxWidth / img.width;
                canvasTemp.width = maxWidth;
                canvasTemp.height = Math.round(img.height * scale);

                var ctxTemp = canvasTemp.getContext('2d');
                ctxTemp.drawImage(img, 0, 0, canvasTemp.width, canvasTemp.height);

                logoBase64 = canvasTemp.toDataURL('image/jpeg', 0.6);
                var preview = document.getElementById('setup-logo-preview');
                preview.src = logoBase64;
                preview.classList.remove('hidden');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    window.onload = function() {
        var params = new URLSearchParams(window.location.search);
        if (params.has('data')) {
            try {
                var decoded = decodeURIComponent(escape(atob(params.get('data'))));
                datosCapacitacion = JSON.parse(decoded);
                mostrarFormularioTrabajador();
            } catch (e) {
                alert("El enlace de capacitación no es válido.");
            }
        }
    };

    function generarEnlaceQR() {
        datosCapacitacion = {
            logo: logoBase64,
            empTitulo: document.getElementById('setup-empresa-titulo').value || "REGISTRO CAPACITACIÓN",
            actividad: document.getElementById('setup-actividad').value || "Capacitación",
            temas: document.getElementById('setup-temas').value || "Sin detalles",
            fecha: document.getElementById('setup-fecha').value,
            relator: document.getElementById('setup-relator').value || "-"
        };

        var jsonStr = JSON.stringify(datosCapacitacion);
        var encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        var baseUrl = window.location.href.split('?').shift();
        currentUrl = baseUrl + "?data=" + encoded;

        document.getElementById('share-link').value = currentUrl;
        
        var servidor = "https://api.qrserver" + String.fromCharCode(46, 99) + "om/v1/create-qr-code/";
        var qrUrl = servidor + "?size=220x220&color=141414&data=" + encodeURIComponent(currentUrl);
        document.getElementById('qrcode').innerHTML = '<img src="' + qrUrl + '" alt="Código QR">';
        document.getElementById('qr-result').classList.remove('hidden');
    }

    function copiarEnlace() {
        var copyText = document.getElementById("share-link");
        copyText.select();
        document.execCommand("copy");
        alert("Enlace copiado al portapapeles");
    }

    function abrirVistaTrabajador() {
        window.location.href = currentUrl;
    }

    function mostrarFormularioTrabajador() {
        document.getElementById('view-setup').classList.add('hidden');
        document.getElementById('view-worker').classList.remove('hidden');

        if (datosCapacitacion.logo) {
            var wLogo = document.getElementById('w-logo-img');
            wLogo.src = datosCapacitacion.logo;
            wLogo.classList.remove('hidden');
        }

        document.getElementById('w-titulo-empresa').innerText = datosCapacitacion.empTitulo;
        document.getElementById('w-actividad').innerText = datosCapacitacion.actividad;
        document.getElementById('w-temas').innerText = datosCapacitacion.temas;
        document.getElementById('w-fecha').innerText = datosCapacitacion.fecha;
        document.getElementById('w-relator').innerText = datosCapacitacion.relator;

        inicializarCanvas();
    }

    var canvas, ctx, dibujando = false, tieneFirma = false;

    function inicializarCanvas() {
        canvas = document.getElementById('sig-canvas');
        ctx = canvas.getContext('2d');
        
        var rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#141414';

        canvas.addEventListener('mousedown', function(e) { dibujando = true; tieneFirma = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
        canvas.addEventListener('mousemove', function(e) { if (dibujando) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
        canvas.addEventListener('mouseup', function() { dibujando = false; });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            var touch = e.touches.item(0);
            var rect = canvas.getBoundingClientRect();
            dibujando = true; tieneFirma = true;
            ctx.beginPath();
            ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        });
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!dibujando) return;
            var touch = e.touches.item(0);
            var rect = canvas.getBoundingClientRect();
            ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
            ctx.stroke();
        });
        canvas.addEventListener('touchend', function() { dibujando = false; });
    }

    function limpiarFirma() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tieneFirma = false;
    }

    function finalizarRegistro() {
        var nombre = document.getElementById('t-nombre').value.trim();
        var rut = document.getElementById('t-rut').value.trim();
        var cargo = document.getElementById('t-cargo').value.trim();
        var instalacion = document.getElementById('t-instalacion').value.trim();
        var contacto = document.getElementById('t-contacto').value.trim();
        var sexo = document.getElementById('t-sexo').value;

        if (!nombre || !rut || !cargo || !instalacion || !contacto) {
            alert("Por favor completa todos los campos obligatorios.");
            return;
        }
        if (!tieneFirma) {
            alert("Por favor dibuja tu firma antes de continuar.");
            return;
        }

        var ahora = new Date();
        var fechaStr = ahora.toISOString().slice(0,10).replace(/-/g,'');
        var rand = Math.floor(100000 + Math.random() * 900000);
        var folio = "REGISTRO DIGITAL - SST-" + fechaStr + "-" + rand;

        if (datosCapacitacion.logo) {
            var rLogo = document.getElementById('r-logo-img');
            rLogo.src = datosCapacitacion.logo;
            rLogo.classList.remove('hidden');
        }

        document.getElementById('r-titulo-empresa').innerText = datosCapacitacion.empTitulo;
        document.getElementById('r-folio').innerText = folio;
        document.getElementById('r-actividad').innerText = datosCapacitacion.actividad;
        document.getElementById('r-temas').innerText = datosCapacitacion.temas;
        document.getElementById('r-fecha').innerText = datosCapacitacion.fecha;
        document.getElementById('r-relator').innerText = datosCapacitacion.relator;

        document.getElementById('r-nombre').innerText = nombre;
        document.getElementById('r-rut').innerText = rut;
        document.getElementById('r-cargo').innerText = cargo;
        document.getElementById('r-sexo').innerText = sexo;
        document.getElementById('r-instalacion').innerText = instalacion;
        document.getElementById('r-contacto').innerText = contacto;

        document.getElementById('r-firma-img').src = canvas.toDataURL();
        document.getElementById('r-firma-nombre').innerText = nombre;

        var horaStr = ahora.toLocaleString('es-CL');
        document.getElementById('r-timestamp').innerHTML = "Registro generado: " + horaStr + "<br>Respaldo listo para guardar o compartir por WhatsApp.";

        document.getElementById('view-worker').classList.add('hidden');
        document.getElementById('view-receipt').classList.remove('hidden');
    }

    function descargarImagen() {
        window.print();
    }
</script>

</body>
</html>
